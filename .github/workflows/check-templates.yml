name: Check Runtime Assets

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify template sync is current
        run: npm run check-templates

      - name: Verify brain-msg drift contract
        run: bun scripts/check-brain-msg-drift.ts

      - name: Verify generated manifests are current
        run: |
          bun scripts/generate-skill-manifests.ts
          git diff --exit-code -- .claude/skills .agentbootup
          test -z "$(git ls-files --others --exclude-standard -- .claude/skills .agentbootup)"

      - name: Verify branch overlay write-path conformance
        run: node ./scripts/branch-conformance-gate.mjs
